<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-project</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pagination/pagination.css" />
    <script src="script.js" defer ></script>
    <script src="pagination/pagination.js" defer></script>
  
  </head>
  <body>
    <h1>Product Store</h1>
 
      <div class="home-search">
        <input type="text" placeholder="Search your product here" id="searchInput">
        <button id="searchbtn" class="primary">Search</button>
        <button id="clearSearchBtn" class="secondary" type="button">Clear</button>

        <a class="link-btn" href="searchHistory.html">See Search History</a>
        <a class="link-btn" href="viewHistory.html">View History</a>
      </div>

      <div id="suggestions"></div>
      <div id="searchResults" class="products-grid"></div>

      <section class="pagination-container">
        <div id="productList" class="product-grid" aria-live="polite"></div>

        <div class="pagination-controls">
          
          <button id="prevBtn" class="page-btn">Prev</button>

          <div class="page-info-wrap">
            <div id="pageInfo" class="page-info"></div>
           
          </div>

          <button id="nextBtn" class="page-btn">Next</button>
         
        </div>
      </section>
  </body>
</html>
